# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.5
neoforge_version = 26.3.0.33-beta

# Mod
maven_group=net.rpg_series
archives_name=relics
mod_version=1.4.1

# Dependencies
fabric_api_version=0.160.6+26.3
# TODO 26.3: TinyConfig has no 26.3 build (Modrinth checked 2026-09-20); 4.0.1 is proven to load on 26.3 (SpellPower, Critical Strike).
tiny_config_version=4.0.1
cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3

ranged_weapon_api_version=4.0.0+26.3
spell_power_version=1.6.2+26.3
spell_engine_version=1.10.9+26.3

# Fabric only
# Trinkets Updated 4.1 (mod id `trinkets_updated`, API package eu.pb4.trinkets.api) no longer uses
# Cardinal Components; it nests yumi-mc-foundation.
trinkets_version=4.2.0+26.3
mod_menu_version=21.0.0-beta.1

# NeoForge only
# `enable_curios` switches the whole Curios integration on or off in one place: when false,
# `neoforge/.../compat/curios/**` is excluded from compilation, the dependency is not declared, and the single
# call site in `neoforge/.../compat/CompatFeatures` finds nothing to resolve reflectively (the plain vanilla
# relic item factory stays in place). It was introduced on 26.3 while Curios had no 26.3 build; Curios
# 17.0.0-beta+26.3 shipped on 2026-09-22, so the integration is on again. Keep the flag for the next hop.
enable_curios=true
curios_version=17.0.0-beta+26.3
